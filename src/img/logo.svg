<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1890ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#096dd9;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="url(#grad1)"/>
  <!-- OPC-UA stylized icon -->
  <g fill="white">
    <!-- Server node -->
    <rect x="35" y="20" width="30" height="20" rx="3"/>
    <!-- Connection lines -->
    <line x1="50" y1="40" x2="50" y2="55" stroke="white" stroke-width="3"/>
    <line x1="50" y1="55" x2="30" y2="70" stroke="white" stroke-width="3"/>
    <line x1="50" y1="55" x2="70" y2="70" stroke="white" stroke-width="3"/>
    <!-- Client nodes -->
    <circle cx="30" cy="75" r="8"/>
    <circle cx="70" cy="75" r="8"/>
  </g>
</svg>
