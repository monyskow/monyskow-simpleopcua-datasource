# =============================================================================
# Docker Compose - E2E Testing Setup
# =============================================================================
# This setup is used by Playwright E2E tests (npm run e2e).
# It provisions a single "OPC-UA Test Server" datasource that the tests expect.
#
# Note: No actual OPC-UA server is included - most E2E tests focus on UI
# functionality and handle connection errors gracefully.
#
# Usage:
#   npm run build && mage buildAll    # Build the plugin first
#   npm run e2e                        # Runs this compose automatically
#
# Or manually:
#   docker compose -f docker-compose.e2e.yaml up
#   Open http://localhost:3000
# =============================================================================

services:
  grafana:
    user: root
    container_name: 'monyskow-simpleopcua-datasource'
    build:
      context: .config
      args:
        grafana_image: ${GRAFANA_IMAGE:-grafana-enterprise}
        grafana_version: ${GRAFANA_VERSION:-12.2.0}
        development: ${DEVELOPMENT:-false}
        anonymous_auth_enabled: ${ANONYMOUS_AUTH_ENABLED:-true}
    ports:
      - 3000:3000/tcp
    volumes:
      # Plugin mounted for Grafana to load
      - ./dist:/var/lib/grafana/plugins/monyskow-simpleopcua-datasource
      # Source code mounted for development
      - .:/root/monyskow-simpleopcua-datasource
      # Provision E2E test datasource
      - ./provisioning/datasources/datasources-e2e.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
    environment:
      NODE_ENV: development
      GF_LOG_FILTERS: plugin.monyskow-simpleopcua-datasource:debug
      GF_LOG_LEVEL: debug
      GF_DATAPROXY_LOGGING: 1
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: monyskow-simpleopcua-datasource
    restart: unless-stopped
