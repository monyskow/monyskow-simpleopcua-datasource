apiVersion: 1

# E2E datasource: anonymous auth, no security (None/None).
# Matches the original datasources-e2e.yaml that pre-dates the matrix workflow.

datasources:
  - name: 'OPC-UA Test Server'
    uid: opcua-test-server
    type: monyskow-simpleopcua-datasource
    access: proxy
    isDefault: true
    jsonData:
      endpoint: 'opc.tcp://opcua-server:4840'
      securityPolicy: 'None'
      securityMode: 'None'
      authMethod: 'anonymous'
      timeout: 10
    editable: true
