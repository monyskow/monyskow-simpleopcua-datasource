apiVersion: 1

# E2E datasource: certificate auth, Basic256Sha256 / SignAndEncrypt.
# The client cert (test-servers/fixtures/client.crt) serves as both the TLS channel
# cert and the OPC UA identity token. The server auto-accepts unknown client certs
# (automaticallyAcceptUnknownCertificate: true in server.js).
# URI SAN in the cert: urn:grafana-opcua-client:grafana:simpleopcua:client

