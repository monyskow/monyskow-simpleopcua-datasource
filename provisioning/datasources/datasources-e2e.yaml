apiVersion: 1

# =============================================================================
# OPC-UA Data Source for E2E Testing
# =============================================================================
# This datasource is used by E2E tests (Playwright) which expect:
# - Name: "OPC-UA Test Server"
# - UID: "opcua-test-server"
#
# Endpoint points to the opcua-server container in the e2e compose network.
# The server accepts anonymous, username/password, and certificate auth across
# all security policies (None, Basic256Sha256, Aes256_Sha256_RsaPss).
# =============================================================================

datasources:
  - name: 'OPC-UA Test Server'
    uid: opcua-test-server
    type: monyskow-simpleopcua-datasource
    access: proxy
    isDefault: true
    jsonData:
      endpoint: 'opc.tcp://opcua-server:4840'
      securityPolicy: 'None'
      securityMode: 'None'
      authMethod: 'anonymous'
      timeout: 10
    editable: true
