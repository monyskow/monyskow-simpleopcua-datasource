apiVersion: 1

# E2E datasource: username/password auth, no security (None/None).
# Credentials: user1 / password1 (defined in test-servers/node-opcua-server/server.js).

datasources:
  - name: 'OPC-UA Test Server'
    uid: opcua-test-server
    type: monyskow-simpleopcua-datasource
    access: proxy
    isDefault: true
    jsonData:
      endpoint: 'opc.tcp://opcua-server:4840'
      securityPolicy: 'None'
      securityMode: 'None'
      authMethod: 'userpass'
      timeout: 10
    secureJsonData:
      username: 'user1'
      password: 'password1'
    editable: true
