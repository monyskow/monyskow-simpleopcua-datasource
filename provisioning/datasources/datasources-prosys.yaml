datasources:
  # ===========================================================================
  # Prosys OPC-UA Simulation Server (Host Machine)
  # Endpoint: opc.tcp://host.docker.internal:53530/OPCUA/SimulationServer
  # ===========================================================================

  # 01. None/None + Anonymous
  - name: "01. None/None + Anon (Prosys)"
    uid: ds-prosys-none-anon
    type: monyskow-simpleopcua-datasource
    access: proxy
    jsonData:
      endpoint: "opc.tcp://host.docker.internal:53530/OPCUA/SimulationServer"
      securityPolicy: "None"
      securityMode: "None"
      authMethod: "anonymous"
      timeout: 10
    editable: true

  # 02. None/None + User/Pass
  - name: "02. None/None + User (Prosys)"
    uid: ds-prosys-none-userpass
    type: monyskow-simpleopcua-datasource
    access: proxy
    jsonData:
      endpoint: "opc.tcp://host.docker.internal:53530/OPCUA/SimulationServer"
      securityPolicy: "None"
      securityMode: "None"
      authMethod: "userpass"
      timeout: 10
    secureJsonData:
      username: "user1"
      password: "password1"
    editable: true

  # ===========================================================================
  # SECURITY POLICY: Basic256Sha256
  # ===========================================================================

  # 03. Basic256Sha256/Sign + Anonymous
  - name: "03. Basic256Sha256/Sign + Anon (Prosys)"
    uid: ds-prosys-basic256-sign-anon
    type: monyskow-simpleopcua-datasource
    access: proxy
    jsonData:
      endpoint: "opc.tcp://host.docker.internal:53530/OPCUA/SimulationServer"
      securityPolicy: "Basic256Sha256"
      securityMode: "Sign"
      authMethod: "anonymous"
      timeout: 10
    secureJsonData:
      clientCert: *client-cert
      clientKey: *client-key
    editable: true

  # 04. Basic256Sha256/Sign + User/Pass
