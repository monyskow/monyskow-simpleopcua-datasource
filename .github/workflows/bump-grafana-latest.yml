name: Bump Grafana latest-stable

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

concurrency:
  group: bump-grafana-latest
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest stable Grafana version
        id: latest
        # Matches X.Y.Z and X.Y.Z-security-NN releases. sort -V ranks a
        # security re-release above its own base patch (security-01 > base)
        # but a newer base still wins (13.0.2 > 13.0.1-security-01).
        run: |
          set -euo pipefail
          NEW=$(curl -s 'https://hub.docker.com/v2/repositories/grafana/grafana/tags?ordering=last_updated&page_size=100' \
            | jq -r '.results[].name' \
            | { grep -E '^[0-9]+\.[0-9]+\.[0-9]+(-security-[0-9]+)?$' || true; } \
            | sort -V \
            | tail -1)
          if [ -z "$NEW" ]; then
            echo "No stable X.Y.Z or X.Y.Z-security-NN tag found in last 100 updates" >&2
            exit 1
          fi
          echo "version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Check if bump is needed
        id: check
        # latest-stable lives on the last line of .grafana-versions
        run: |
          current=$(tail -1 .grafana-versions)
          new="${{ steps.latest.outputs.version }}"
          higher=$(printf '%s\n%s\n' "$current" "$new" | sort -V | tail -1)
          if [ "$current" = "$new" ] || [ "$higher" = "$current" ]; then
            echo "No bump needed: current $current >= new $new"
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Bump needed: $current -> $new"
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update .grafana-versions
        if: steps.check.outputs.needed == 'true'
        # Update the last line of .grafana-versions (latest-stable slot)
        run: |
          NEW="${{ steps.latest.outputs.version }}"
          sed -i "\$s/.*/$NEW/" .grafana-versions

      - name: Create PR
        if: steps.check.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW="${{ steps.latest.outputs.version }}"
          BRANCH="chore/bump-grafana-latest-${NEW}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add .grafana-versions
          git commit -m "chore: bump grafana latest-stable to ${NEW}"
          git push origin "$BRANCH"

          gh pr create \
            --title "chore: bump grafana latest-stable to ${NEW}" \
            --body "Weekly automated bump of the latest-stable Grafana slot (last line of \`.grafana-versions\`) from the previous version to \`${NEW}\`." \
            --base main \
            --head "$BRANCH"
