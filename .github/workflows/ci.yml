name: CI

# Multi-stack CI skeleton. Each job runs only when relevant files changed.
# After init-project.sh, customize this for your actual stack.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      python: ${{ steps.filter.outputs.python }}
      node: ${{ steps.filter.outputs.node }}
      dotnet: ${{ steps.filter.outputs.dotnet }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
            python:
              - '**/*.py'
              - 'pyproject.toml'
              - 'requirements*.txt'
              - 'uv.lock'
            node:
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.js'
              - '**/*.jsx'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'package-lock.json'
            dotnet:
              - '**/*.cs'
              - '**/*.csproj'
              - '**/*.sln'

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - run: go build ./...
      - run: go test ./... -race -count=1
      - uses: golangci/golangci-lint-action@v7
        with:
          # golangci-lint v2 (built with Go 1.25+) is required to lint code
          # targeting Go 1.25; the v1.x `latest` is built with Go 1.24 and
          # refuses to load. Action v7 is also required — v6 rejects v2 versions.
          version: v2.12.2

  python:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        run: pip install uv
      - name: Install deps
        run: |
          if [[ -f pyproject.toml ]]; then
            uv sync --all-extras --dev || pip install -e .[dev]
          elif [[ -f requirements.txt ]]; then
            pip install -r requirements.txt
          fi
      - name: Lint
        run: |
          if command -v ruff >/dev/null; then ruff check .; fi
      - name: Test
        run: |
          if command -v pytest >/dev/null; then pytest -q; fi

  node:
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: ${{ hashFiles('pnpm-lock.yaml') != '' && 'pnpm' || 'npm' }}
      - name: Install
        run: |
          if [[ -f pnpm-lock.yaml ]]; then
            npm install -g pnpm
            pnpm install --frozen-lockfile
          else
            npm ci
          fi
      - name: Lint
        run: |
          if [[ -f pnpm-lock.yaml ]]; then pnpm run lint --if-present; else npm run lint --if-present; fi
      - name: Test
        run: |
          if [[ -f pnpm-lock.yaml ]]; then pnpm test --if-present; else npm test --if-present; fi

  dotnet:
    needs: changes
    if: needs.changes.outputs.dotnet == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore
      - run: dotnet build --no-restore --configuration Release
      - run: dotnet test --no-build --configuration Release --verbosity normal
