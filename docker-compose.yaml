# =============================================================================
# Docker Compose - Basic Setup
# =============================================================================
# This is the minimal setup with just Grafana and the plugin loaded.
# Use this for basic plugin development and testing.
#
# Usage:
#   npm run build && mage buildAll  # Build the plugin first
#   docker compose up               # Start Grafana
#   Open http://localhost:3000
#
# For full testing with OPC-UA simulators, use:
#   docker compose -f docker-compose.full.yaml up
#
# For ProSys OPC-UA Simulator testing, use:
#   docker compose -f docker-compose.prosys.yaml up
# =============================================================================

services:
  grafana:
    user: root
    container_name: 'monyskow-simpleopcua-datasource'
    build:
      context: .config
      args:
        grafana_image: ${GRAFANA_IMAGE:-grafana-enterprise}
        grafana_version: ${GRAFANA_VERSION:-12.2.0}
        development: ${DEVELOPMENT:-false}
        anonymous_auth_enabled: ${ANONYMOUS_AUTH_ENABLED:-true}
    ports:
      - 3000:3000/tcp
    volumes:
      - grafana-data:/var/lib/grafana  # Persistent storage for Grafana DB
      # Plugin mounted for Grafana to load
      - ./dist:/var/lib/grafana/plugins/monyskow-simpleopcua-datasource
      # Source code mounted for development
      - .:/root/monyskow-simpleopcua-datasource
      # NOTE: Provisioning directory intentionally NOT mounted
      # Use docker-compose.full.yaml for pre-configured datasources and dashboards
    environment:
      NODE_ENV: development
      GF_LOG_FILTERS: plugin.monyskow-simpleopcua-datasource:debug
      GF_LOG_LEVEL: debug
      GF_DATAPROXY_LOGGING: 1
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: monyskow-simpleopcua-datasource
    restart: unless-stopped

volumes:
  grafana-data:
    name: grafana-data
